name: mini-ai-agent

# Shared build for the API and the two MCP servers (same Python image).
x-app: &app
  build:
    context: .
    dockerfile: api/Dockerfile

services:
  # ---------------------------------------------------------------- Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: mini-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 /bin/ollama list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # One-shot service: makes sure the model exists before the API starts.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: mini-ollama-pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/ollama", "pull", "${OLLAMA_MODEL:-qwen2.5-coder:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------- MCP servers
  email-mcp:
    <<: *app
    container_name: mini-email-mcp
    command: ["python", "mcp_servers/email_server.py"]
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - ARTIFACTS_DIR=/app/artifacts
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
    volumes:
      - artifacts_data:/app/artifacts
    expose:
      - "8001"

  report-mcp:
    <<: *app
    container_name: mini-report-mcp
    command: ["python", "mcp_servers/report_server.py"]
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8002
      - ARTIFACTS_DIR=/app/artifacts
    volumes:
      - artifacts_data:/app/artifacts
    expose:
      - "8002"

  search-mcp:
    <<: *app
    container_name: mini-search-mcp
    command: ["python", "mcp_servers/search_server.py"]
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8003
    expose:
      - "8003"

  # ------------------------------------------------------------------- API
  api:
    <<: *app
    container_name: mini-api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
      - EMAIL_MCP_URL=${EMAIL_MCP_URL:-http://email-mcp:8001/mcp}
      - REPORT_MCP_URL=${REPORT_MCP_URL:-http://report-mcp:8002/mcp}
      - SEARCH_MCP_URL=${SEARCH_MCP_URL:-http://search-mcp:8003/mcp}
      - ARTIFACTS_DIR=/app/artifacts
      - SMTP_HOST=${SMTP_HOST:-}
    volumes:
      - api_data:/app/data
      - artifacts_data:/app/artifacts
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      email-mcp:
        condition: service_started
      report-mcp:
        condition: service_started
      search-mcp:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --------------------------------------------------------------- Airflow
  postgres:
    image: postgres:16-alpine
    container_name: mini-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: mini-airflow
    # Remove a stale webserver pid file left by a previous container start.
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -f /opt/airflow/airflow-webserver.pid && exec airflow standalone"]
    ports:
      - "8081:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__WEBSERVER__WEB_SERVER_HOST=0.0.0.0
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - API_URL=http://api:8000/tasks
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  ollama_data:
  api_data:
  artifacts_data:
  airflow_db:
